name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Run Headless Unit Tests
        run: npm run test:unit

      - name: Run VS Code Extension Test Suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run VS Code Extension Test Suite (macOS)
        if: runner.os == 'macOS'
        run: npm test

      - name: Package Extension
        run: npm run package
